<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Strength Check</title>
    <link rel="stylesheet" href="./styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" integrity="sha512-iecdLmaskl7CVkqkXNQ/ZmH+zGtG+Nv9eCz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
    <div class="container">
        <h3 class="login">Please LogIn</h3>
        <form id="form"> 
            <div class="form-control">
                <input type="email" id="email" placeholder="Enter your email">
                <label for="email">Email</label>
            </div>
            <div class="form-control">
                <input type="password" id="password" placeholder="Enter your password">
                <label for="password">Password</label>
            </div>
            <div class="myProgress">
                <div class="myBar"></div>
                <span class="message">your password should be strong</span>
            </div>
            <button type="submit" class="btn">login</button>
            <p>Don't have an account? <a href="#">Sign up</a></p>
        </form>
    </div>
    <script src="./script.js"></script>
</body>
</html>
